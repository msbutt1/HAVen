[project]
name = "vibeguard-signals"
version = "0.1.0"
description = "VibeGuard host-side reference: device telemetry contract, simulation, and signal processing (Salaar-owned)."
readme = "README.md"
authors = [
    { name = "msbutt1", email = "msbutt112004@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "scipy>=1.17.1",
]

[project.scripts]
vg-validate = "vibeguard_signals.validate_cli:main"
vg-bandwidth = "vibeguard_signals.bandwidth:main"
vg-sim = "vibeguard_signals.sim_cli:main"
vg-process = "vibeguard_signals.process_cli:main"
vg-replay = "vibeguard_signals.replay_cli:main"
vg-demo = "vibeguard_signals.demo_cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
