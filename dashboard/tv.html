<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HAVen live meters</title>
  <meta name="theme-color" content="#0b0e14">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f8ff7'/%3E%3Cpath d='M5 16h5l3-7 4 14 3-9 2 2h5' fill='none' stroke='%23131826' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preload" href="assets/fonts/onest-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tv.css">
</head>
<body data-source="none">
  <!-- TV view: two meters fed by the sleeve's own sensors through the backend (/ws/live).
       The badge is green "LIVE" only when the backend's device is the real wearable (Wi-Fi or serial), its records
       say provenance "live", and the last one arrived under a second ago. Anything else is named for what it is.
       Keys: R relaxed, S squeeze (grip calibration), F full screen. URL: ?vibmax=10 sets 100 % vibration in m/s². -->
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 3 10 3-7 2 2h4"/></svg></span>HAVen</div>
    <div class="badge" id="badge" role="status"><span class="pulse" aria-hidden="true"></span><span id="badge-text">Connecting…</span></div>
  </header>

  <main class="meters">
    <section class="meter" id="m-grip" aria-labelledby="t-grip">
      <h2 class="m-name" id="t-grip">Grip</h2>
      <p class="m-sensor" id="s-grip">EMG · forearm</p>
      <div class="m-track" role="meter" aria-labelledby="t-grip" aria-valuemin="0" aria-valuemax="100" id="track-grip">
        <div class="m-fill" id="fill-grip"></div>
        <div class="m-segs" aria-hidden="true"></div>
        <div class="m-peak" id="peak-grip" aria-hidden="true"></div>
        <div class="m-overlay" id="ov-grip" hidden>Calibrate<small>R relax · S squeeze</small></div>
      </div>
      <div class="m-pct"><span id="pct-grip">--</span><span class="pct-sign">%</span></div>
      <p class="m-detail" id="d-grip">of max squeeze</p>
    </section>

    <section class="meter" id="m-vib" aria-labelledby="t-vib">
      <h2 class="m-name" id="t-vib">Vibration</h2>
      <p class="m-sensor" id="s-vib">Accelerometer · wrist</p>
      <div class="m-track" role="meter" aria-labelledby="t-vib" aria-valuemin="0" aria-valuemax="100" id="track-vib">
        <div class="m-fill" id="fill-vib"></div>
        <div class="m-segs" aria-hidden="true"></div>
        <div class="m-peak" id="peak-vib" aria-hidden="true"></div>
      </div>
      <div class="m-pct"><span id="pct-vib">--</span><span class="pct-sign">%</span></div>
      <p class="m-detail" id="d-vib">-- m/s²</p>
    </section>
  </main>

  <footer class="proof" aria-label="Where the data comes from">
    <span>Device <b id="pf-device">--</b></span>
    <span>EMG <b id="pf-emg">--</b>/s</span>
    <span>IMU <b id="pf-imu">--</b>/s</span>
    <span>Missing samples <b id="pf-gaps">--</b></span>
    <span>Last packet <b id="pf-age">--</b></span>
    <span class="cal-btns">
      <button class="btn" id="btn-relaxed" title="Keyboard: R">Relax 3 s</button>
      <button class="btn" id="btn-squeeze" title="Keyboard: S">Squeeze 3 s</button>
    </span>
  </footer>

  <div class="toast" id="toast" role="alert" hidden></div>
  <script src="js/tv.js"></script>
</body>
</html>
