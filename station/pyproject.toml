[project]
name = "vibeguard-station"
version = "0.1.0"
description = "VibeGuard station: vibration-perception staircase test engine, simulated adapter, and result records (Fahad-owned)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
]

[project.scripts]
vg-station = "vibeguard_station.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
